[project]
name = "vibewarz"
version = "0.6.1"
description = "Python SDK for writing vibewarz bots — play live or locally"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["bot", "game", "arena", "vibewarz", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "websockets>=12.0",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "httpx>=0.27",
  "vibewarz-games>=0.2,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vibewarz = "vibewarz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibewarz"]

# Bundled React replay viewer (built from ../viewer/). hatchling includes .py
# files inside the package by default; force-include explicitly pulls the
# committed Vite output into the wheel so `vibewarz replay --watch` can serve
# it via importlib.resources without requiring a Node toolchain at install
# time. CI freshness check guards against the committed bundle drifting from
# the @vibewarz/replay-viewer source — rebuild with `pnpm -F viewer build` at
# the workspace root.
[tool.hatch.build.targets.wheel.force-include]
"src/vibewarz/viewer_dist" = "vibewarz/viewer_dist"

# Same files need to ship in the sdist too, otherwise a source install
# (`pip install vibewarz --no-binary :all:`) would build a wheel from a tarball
# that didn't contain the viewer.
[tool.hatch.build.targets.sdist]
include = [
  "src/vibewarz/**",
  "README.md",
  "pyproject.toml",
]
